<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-labelledby="title desc">
  <title id="title">AIOS-style Agent install card</title>
  <desc id="desc">A compact AIOS-style card saying paste one repo link to an agent and let it install the TicProxy server.</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b21"/>
      <stop offset="1" stop-color="#0c0f13"/>
    </linearGradient>
    <linearGradient id="aura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bd8c4"/>
      <stop offset="0.54" stop-color="#f0b95c"/>
      <stop offset="1" stop-color="#e66d67"/>
    </linearGradient>
    <style>
      .title { font: 860 31px Inter, Segoe UI, Arial, sans-serif; fill: #f6f2e8; letter-spacing: 0; }
      .body { font: 620 17px Inter, Segoe UI, Arial, sans-serif; fill: rgba(246,242,232,.68); letter-spacing: 0; }
      .code { font: 760 15px Consolas, Cascadia Mono, monospace; fill: #f6f2e8; letter-spacing: 0; }
      .pulse { animation: pulse 2.3s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity:.62; transform: scale(.96); } 50% { opacity:1; transform: scale(1.06); } }
    </style>
  </defs>
  <rect width="900" height="170" rx="26" fill="url(#ink)" stroke="rgba(246,242,232,.14)"/>
  <g transform="translate(34 26)">
    <rect width="118" height="118" rx="31" fill="#151a21" stroke="rgba(246,242,232,.13)"/>
    <path d="M34 88 56 32c4-9 16-10 20-2l28 58" fill="none" stroke="url(#aura)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M46 66h40" fill="none" stroke="#f6f2e8" stroke-width="10" stroke-linecap="round"/>
    <circle class="pulse" cx="96" cy="28" r="8" fill="#f6f2e8"/>
    <circle cx="30" cy="98" r="6" fill="#f0b95c"/>
    <circle cx="102" cy="98" r="6" fill="#e66d67"/>
  </g>
  <text x="184" y="57" class="title">Give your Agent one repo link.</text>
  <text x="184" y="91" class="body">The VPS installer, mobile console, TicProxy /v1 gateway, Windows bridge, and repair docs are all included.</text>
  <rect x="184" y="112" width="656" height="34" rx="17" fill="rgba(246,242,232,.06)" stroke="rgba(246,242,232,.13)"/>
  <text x="204" y="135" class="code">https://github.com/Ticmiro/codex-mobile-app-one-api-to-rule-them-all</text>
</svg>
