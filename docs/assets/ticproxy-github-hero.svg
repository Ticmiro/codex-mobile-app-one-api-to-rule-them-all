<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Codex Mobile App hero in AIOS style</title>
  <desc id="desc">Animated AIOS-style GitHub banner for a one-time TicProxy Codex Mobile install.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161c"/>
      <stop offset="0.58" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#151a21"/>
    </linearGradient>
    <linearGradient id="aura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bd8c4"/>
      <stop offset="0.54" stop-color="#f0b95c"/>
      <stop offset="1" stop-color="#e66d67"/>
    </linearGradient>
    <linearGradient id="auraLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bd8c4"/>
      <stop offset="0.5" stop-color="#f0b95c"/>
      <stop offset="1" stop-color="#e66d67"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-35%" width="150%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font: 800 56px Inter, Segoe UI, Arial, sans-serif; fill: #f6f2e8; letter-spacing: 0; }
      .sub { font: 560 24px Inter, Segoe UI, Arial, sans-serif; fill: rgba(246,242,232,.72); letter-spacing: 0; }
      .kicker { font: 760 16px Inter, Segoe UI, Arial, sans-serif; fill: #2bd8c4; letter-spacing: .06em; }
      .code { font: 760 17px Consolas, Cascadia Mono, monospace; fill: #f6f2e8; letter-spacing: 0; }
      .pill { font: 760 13px Inter, Segoe UI, Arial, sans-serif; fill: #f6f2e8; letter-spacing: 0; }
      .label { font: 800 18px Inter, Segoe UI, Arial, sans-serif; fill: #f6f2e8; letter-spacing: 0; }
      .muted { font: 650 12px Inter, Segoe UI, Arial, sans-serif; fill: rgba(246,242,232,.58); letter-spacing: 0; }
      .tile { fill: rgba(246,242,232,.055); stroke: rgba(246,242,232,.13); stroke-width: 1.4; }
      .float { animation: float 4.8s ease-in-out infinite; }
      .float2 { animation: float 5.5s ease-in-out infinite reverse; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-origin: center; }
      .route { stroke: url(#auraLine); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 16 13; animation: route 6.5s linear infinite; filter: url(#glow); }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes pulse { 0%,100% { opacity: .58; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.06); } }
      @keyframes route { to { stroke-dashoffset: -180; } }
    </style>
  </defs>

  <rect width="1280" height="420" rx="38" fill="url(#paper)"/>
  <path d="M86 332C205 250 305 358 427 280C544 205 542 113 691 132C838 150 842 268 982 230C1094 200 1130 116 1210 126" fill="none" stroke="rgba(246,242,232,.07)" stroke-width="3"/>
  <circle class="pulse" cx="1166" cy="88" r="54" fill="none" stroke="#2bd8c4" stroke-width="3" opacity=".28"/>
  <circle class="pulse" cx="142" cy="330" r="76" fill="none" stroke="#f0b95c" stroke-width="3" opacity=".18" style="animation-delay:.45s"/>

  <g transform="translate(72 60)">
    <rect x="0" y="0" width="196" height="196" rx="50" fill="#151a21" filter="url(#shadow)"/>
    <path d="M47 151 88 45c5-13 21-15 28-3l51 109" fill="none" stroke="url(#aura)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70 110h70" fill="none" stroke="#f6f2e8" stroke-width="15" stroke-linecap="round" opacity=".94"/>
    <circle class="pulse" cx="169" cy="42" r="11" fill="#f6f2e8"/>
    <circle cx="169" cy="42" r="22" fill="none" stroke="#2bd8c4" stroke-width="3" opacity=".35"/>
    <circle cx="45" cy="169" r="7" fill="#f0b95c"/>
    <circle cx="176" cy="168" r="7" fill="#e66d67"/>
  </g>

  <g transform="translate(306 78)">
    <text x="0" y="0" class="kicker">AIOS-STYLE SELF-HOST PACKAGE</text>
    <text x="0" y="70" class="title">Codex Mobile App</text>
    <text x="0" y="116" class="sub">One repo. One VPS install. One API key.</text>
    <rect x="0" y="150" width="526" height="48" rx="16" fill="rgba(246,242,232,.06)" stroke="rgba(246,242,232,.14)"/>
    <text x="22" y="181" class="code">curl .../deploy-server-one-shot.sh | sh</text>
    <g transform="translate(0 224)">
      <rect width="150" height="38" rx="19" fill="rgba(43,216,196,.14)" stroke="rgba(43,216,196,.5)"/>
      <text x="20" y="25" class="pill">one-time setup</text>
      <rect x="166" width="154" height="38" rx="19" fill="rgba(240,185,92,.14)" stroke="rgba(240,185,92,.5)"/>
      <text x="186" y="25" class="pill">agent ready</text>
      <rect x="336" width="172" height="38" rx="19" fill="rgba(230,109,103,.14)" stroke="rgba(230,109,103,.48)"/>
      <text x="356" y="25" class="pill">private routing</text>
    </g>
  </g>

  <g transform="translate(875 70)">
    <path class="route" d="M34 84H150"/>
    <path class="route" d="M122 180H236" style="animation-delay:.4s"/>
    <g class="float">
      <rect class="tile" x="0" y="22" width="122" height="122" rx="30"/>
      <path d="M38 64h48M38 84h60M38 104h36" stroke="#2bd8c4" stroke-width="8" stroke-linecap="round"/>
      <text x="9" y="174" class="label">Mobile</text>
      <text x="9" y="194" class="muted">control console</text>
    </g>
    <g class="float2" transform="translate(176 0)">
      <rect class="tile" x="0" y="54" width="132" height="132" rx="34"/>
      <path d="M38 96h56M66 96v48" stroke="#f6f2e8" stroke-width="12" stroke-linecap="round"/>
      <path d="M48 144h64" stroke="#f0b95c" stroke-width="10" stroke-linecap="round"/>
      <circle class="pulse" cx="104" cy="78" r="13" fill="#e66d67"/>
      <text x="4" y="222" class="label">TicProxy</text>
      <text x="4" y="242" class="muted">/v1 gateway</text>
    </g>
    <g transform="translate(58 276)">
      <rect width="324" height="46" rx="15" fill="rgba(246,242,232,.055)" stroke="rgba(246,242,232,.13)"/>
      <circle class="pulse" cx="26" cy="23" r="7" fill="#2bd8c4"/>
      <text x="48" y="29" class="code">API ONE KEY configures Codex</text>
    </g>
  </g>
</svg>
