<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="270" viewBox="0 0 1120 270" role="img" aria-labelledby="title desc">
  <title id="title">AIOS-style install once flow</title>
  <desc id="desc">Five AIOS-style tiles showing repo link, VPS install, mobile console, Windows bridge, and one API key.</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b21"/>
      <stop offset="1" stop-color="#0c0f13"/>
    </linearGradient>
    <linearGradient id="aura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2bd8c4"/>
      <stop offset="0.54" stop-color="#f0b95c"/>
      <stop offset="1" stop-color="#e66d67"/>
    </linearGradient>
    <linearGradient id="auraLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bd8c4"/>
      <stop offset=".5" stop-color="#f0b95c"/>
      <stop offset="1" stop-color="#e66d67"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: url(#ink); stroke: rgba(246,242,232,.13); stroke-width: 1.2; filter: url(#shadow); }
      .num { font: 900 20px Inter, Segoe UI, Arial, sans-serif; fill: #0d1117; letter-spacing: 0; }
      .head { font: 800 20px Inter, Segoe UI, Arial, sans-serif; fill: #f6f2e8; letter-spacing: 0; }
      .body { font: 650 13px Inter, Segoe UI, Arial, sans-serif; fill: rgba(246,242,232,.58); letter-spacing: 0; }
      .arrow { stroke: url(#auraLine); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 12 12; animation: move 4.8s linear infinite; }
      .pulse { animation: pulse 2.3s ease-in-out infinite; transform-origin: center; }
      @keyframes move { to { stroke-dashoffset: -120; } }
      @keyframes pulse { 0%,100% { opacity:.62; transform: scale(.96); } 50% { opacity:1; transform: scale(1.06); } }
    </style>
  </defs>
  <rect class="bg" width="1120" height="270" rx="28"/>
  <path class="arrow" d="M202 135H260"/>
  <path class="arrow" d="M414 135H472" style="animation-delay:.2s"/>
  <path class="arrow" d="M626 135H684" style="animation-delay:.4s"/>
  <path class="arrow" d="M838 135H896" style="animation-delay:.6s"/>

  <g transform="translate(28 48)">
    <rect class="card" width="174" height="172" rx="34"/>
    <circle cx="34" cy="34" r="18" fill="url(#aura)"/><text x="28" y="42" class="num">1</text>
    <path d="M52 82h58M52 103h76M52 124h42" stroke="#2bd8c4" stroke-width="8" stroke-linecap="round"/>
    <text x="24" y="151" class="head">Repo link</text>
  </g>
  <g transform="translate(240 48)">
    <rect class="card" width="174" height="172" rx="34"/>
    <circle cx="34" cy="34" r="18" fill="url(#aura)"/><text x="28" y="42" class="num">2</text>
    <path d="M54 82h66M54 106h48" stroke="#f0b95c" stroke-width="9" stroke-linecap="round"/>
    <circle class="pulse" cx="124" cy="106" r="13" fill="#2bd8c4"/>
    <text x="24" y="151" class="head">One VPS install</text>
  </g>
  <g transform="translate(452 48)">
    <rect class="card" width="174" height="172" rx="34"/>
    <circle cx="34" cy="34" r="18" fill="url(#aura)"/><text x="28" y="42" class="num">3</text>
    <rect x="62" y="62" width="50" height="76" rx="14" fill="rgba(246,242,232,.08)" stroke="rgba(246,242,232,.18)"/>
    <circle class="pulse" cx="87" cy="101" r="15" fill="#2bd8c4"/>
    <text x="24" y="151" class="head">Mobile console</text>
  </g>
  <g transform="translate(664 48)">
    <rect class="card" width="174" height="172" rx="34"/>
    <circle cx="34" cy="34" r="18" fill="url(#aura)"/><text x="28" y="42" class="num">4</text>
    <rect x="44" y="74" width="88" height="50" rx="13" fill="rgba(246,242,232,.08)" stroke="rgba(246,242,232,.18)"/>
    <path d="M66 142h44M88 124v18" stroke="#f0b95c" stroke-width="7" stroke-linecap="round"/>
    <text x="24" y="151" class="head">Windows bridge</text>
  </g>
  <g transform="translate(876 48)">
    <rect class="card" width="216" height="172" rx="34"/>
    <circle cx="34" cy="34" r="18" fill="url(#aura)"/><text x="28" y="42" class="num">5</text>
    <path d="M54 101h108" stroke="url(#auraLine)" stroke-width="13" stroke-linecap="round"/>
    <circle cx="54" cy="101" r="18" fill="#151a21" stroke="#2bd8c4" stroke-width="4"/>
    <circle class="pulse" cx="162" cy="101" r="18" fill="#151a21" stroke="#e66d67" stroke-width="4"/>
    <text x="24" y="151" class="head">One API key</text>
    <text x="24" y="170" class="body">Codex, CLI tools, apps</text>
  </g>
</svg>
