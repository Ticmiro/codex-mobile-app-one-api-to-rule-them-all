<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="270" viewBox="0 0 1120 270" role="img" aria-labelledby="title desc">
  <title id="title">Install once flow</title>
  <desc id="desc">A five step setup flow from GitHub repo link to VPS install, mobile console, Windows bridge, and one proxy key.</desc>
  <defs>
    <linearGradient id="step" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#162034"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54c7ff"/>
      <stop offset=".5" stop-color="#37ffb2"/>
      <stop offset="1" stop-color="#ffe082"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: #0b1020; }
      .card { fill: url(#step); stroke: rgba(255,255,255,.16); stroke-width: 1.3; }
      .num { font: 900 22px Arial, Helvetica, sans-serif; fill: #0b1020; letter-spacing: 0; }
      .head { font: 800 22px Arial, Helvetica, sans-serif; fill: #f7fbff; letter-spacing: 0; }
      .body { font: 600 14px Arial, Helvetica, sans-serif; fill: #aebfd0; letter-spacing: 0; }
      .arrow { stroke: url(#accent); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 12 11; animation: move 4.8s linear infinite; filter: url(#glow); }
      .blink { animation: blink 2s ease-in-out infinite; }
      @keyframes move { to { stroke-dashoffset: -120; } }
      @keyframes blink { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect class="bg" width="1120" height="270" rx="26"/>
  <path class="arrow" d="M200 134H262"/>
  <path class="arrow" d="M414 134H476" style="animation-delay:.2s"/>
  <path class="arrow" d="M628 134H690" style="animation-delay:.4s"/>
  <path class="arrow" d="M842 134H904" style="animation-delay:.6s"/>

  <g transform="translate(28 52)">
    <rect class="card" width="172" height="164" rx="22"/>
    <circle cx="34" cy="34" r="18" fill="url(#accent)"/><text x="27" y="42" class="num">1</text>
    <path d="M60 76h52M60 98h78M60 120h42" stroke="#54c7ff" stroke-width="8" stroke-linecap="round"/>
    <text x="24" y="148" class="head">Repo link</text>
  </g>

  <g transform="translate(242 52)">
    <rect class="card" width="172" height="164" rx="22"/>
    <circle cx="34" cy="34" r="18" fill="url(#accent)"/><text x="27" y="42" class="num">2</text>
    <rect x="42" y="70" width="88" height="58" rx="10" fill="#0d1524" stroke="rgba(255,255,255,.18)"/>
    <path d="M56 88h60M56 108h44" stroke="#37ffb2" stroke-width="7" stroke-linecap="round"/>
    <text x="24" y="148" class="head">One VPS install</text>
  </g>

  <g transform="translate(456 52)">
    <rect class="card" width="172" height="164" rx="22"/>
    <circle cx="34" cy="34" r="18" fill="url(#accent)"/><text x="27" y="42" class="num">3</text>
    <rect x="58" y="62" width="56" height="78" rx="10" fill="#0d1524" stroke="rgba(255,255,255,.18)"/>
    <circle class="blink" cx="86" cy="104" r="16" fill="#54c7ff" opacity=".8"/>
    <text x="24" y="148" class="head">Mobile console</text>
  </g>

  <g transform="translate(670 52)">
    <rect class="card" width="172" height="164" rx="22"/>
    <circle cx="34" cy="34" r="18" fill="url(#accent)"/><text x="27" y="42" class="num">4</text>
    <rect x="38" y="72" width="98" height="56" rx="9" fill="#0d1524" stroke="rgba(255,255,255,.18)"/>
    <path d="M64 142h46M87 128v14" stroke="#ffe082" stroke-width="6" stroke-linecap="round"/>
    <text x="24" y="148" class="head">Windows bridge</text>
  </g>

  <g transform="translate(884 52)">
    <rect class="card" width="208" height="164" rx="22"/>
    <circle cx="34" cy="34" r="18" fill="url(#accent)"/><text x="27" y="42" class="num">5</text>
    <path class="blink" d="M54 100h100" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="54" cy="100" r="18" fill="#0d1524" stroke="#54c7ff" stroke-width="4"/>
    <circle cx="154" cy="100" r="18" fill="#0d1524" stroke="#37ffb2" stroke-width="4"/>
    <text x="24" y="148" class="head">One API key</text>
    <text x="24" y="170" class="body">Codex, CLI tools, apps</text>
  </g>
</svg>
